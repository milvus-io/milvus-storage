name: Python CI

on:
  push:
    paths:
      - 'python/**'
      - 'cpp/**'
      - 'tests/**'
      - '.github/actions/setup-python-test/**'
      - '.github/workflows/python-ci.yml'
  pull_request:
    paths:
      - 'python/**'
      - 'cpp/**'
      - 'tests/**'
      - '.github/actions/setup-python-test/**'
      - '.github/workflows/python-ci.yml'

jobs:
  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        working-directory: ./python
        run: make install

      - name: Lint
        working-directory: ./python
        run: make lint

  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    strategy:
      matrix:
        python-version: ['3.11']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python test environment
        uses: ./.github/actions/setup-python-test
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        working-directory: ./python
        run: make test

      - name: Install Python E2E dependencies
        run: uv pip install --python ./python/.venv/bin/python -r ./tests/requirements.txt

      - name: Run Python E2E smoke
        run: ./python/.venv/bin/python -m pytest -c tests/pytest.ini tests/integration/ -m e2e_smoke -q --tb=short --junitxml="$RUNNER_TEMP/python-e2e-smoke.xml"

      - name: Upload Python E2E smoke result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-e2e-smoke
          path: ${{ runner.temp }}/python-e2e-smoke.xml

      - name: Upload coverage to Codecov
        if: ${{ github.repository == 'milvus-io/milvus-storage' }}
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.MILVUS_STORAGE_CODECOV_TOKEN }}
          files: ./python/coverage.xml
          flags: python
          name: python-coverage
          fail_ci_if_error: false
