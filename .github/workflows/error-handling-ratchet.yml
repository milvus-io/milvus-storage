name: error-handling-ratchet

on:
  push:
    paths:
      - 'cpp/**'
      - '.github/workflows/error-handling-ratchet.yml'
  pull_request:
    paths:
      - 'cpp/**'
      - '.github/workflows/error-handling-ratchet.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: error-handling ratchet
        run: bash cpp/scripts/error_handling_ratchet.sh check
