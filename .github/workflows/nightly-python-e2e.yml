name: Python Nightly E2E

on:
  schedule:
    - cron: '0 4 * * *'
      timezone: Asia/Shanghai
  workflow_dispatch:
  pull_request:
    paths:
      - 'tests/integration/**'
      - '.github/workflows/nightly-python-e2e.yml'
      - '.github/actions/setup-python-test/**'

jobs:
  e2e:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python test environment
        uses: ./.github/actions/setup-python-test
        with:
          python-version: '3.11'
          with-tools: 'True'

      - name: Install integration and stress test dependencies
        id: test-dependencies
        run: uv pip install --python ./python/.venv/bin/python -r ./tests/requirements.txt

      - name: Run integration tests
        run: ./python/.venv/bin/python -m pytest -c tests/pytest.ini tests/integration/ -v --tb=short --junitxml="$RUNNER_TEMP/python-e2e-local.xml"

      - name: Run stress tests at 1% scale
        if: ${{ !cancelled() && steps.test-dependencies.outcome == 'success' }}
        run: ./python/.venv/bin/python -m pytest -c tests/pytest.ini tests/stress/ -v --tb=short --stress-scale=0.01 --junitxml="$RUNNER_TEMP/python-stress-1.xml"

      - name: Run stress tests at 10% scale
        if: ${{ !cancelled() && steps.test-dependencies.outcome == 'success' }}
        run: ./python/.venv/bin/python -m pytest -c tests/pytest.ini tests/stress/ -v --tb=short --stress-scale=0.1 --junitxml="$RUNNER_TEMP/python-stress-10.xml"

      - name: Run stress tests at 100% scale
        if: ${{ !cancelled() && steps.test-dependencies.outcome == 'success' }}
        run: ./python/.venv/bin/python -m pytest -c tests/pytest.ini tests/stress/ -v --tb=short --stress-scale=1.0 --junitxml="$RUNNER_TEMP/python-stress-100.xml"

      - name: Upload local test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-e2e-local
          path: |
            ${{ runner.temp }}/python-e2e-local.xml
            ${{ runner.temp }}/python-stress-*.xml

  remote-e2e:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        backend: [minio, rustfs]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python test environment
        uses: ./.github/actions/setup-python-test
        with:
          python-version: '3.11'
          with-tools: 'True'

      - name: Install integration test dependencies
        run: uv pip install --python ./python/.venv/bin/python -r ./tests/requirements.txt

      - name: Start MinIO
        if: matrix.backend == 'minio'
        run: bash ./cpp/scripts/setup_minio.sh

      - name: Start RustFS
        if: matrix.backend == 'rustfs'
        run: bash ./cpp/scripts/setup_rustfs.sh

      - name: Start secondary RustFS for isolation tests
        if: matrix.backend == 'minio'
        run: bash ./cpp/scripts/setup_rustfs.sh

      - name: Configure remote tests
        env:
          E2E_BACKEND: ${{ matrix.backend }}
        run: |
          ./python/.venv/bin/python - <<'PY'
          import os
          from pathlib import Path

          import yaml

          configurations = {
              'minio': {'address': 'http://localhost:9000', 'access_key': 'minioadmin',
                        'secret_key': 'minioadmin'},
              'rustfs': {'address': 'http://localhost:9002', 'access_key': 'rustfsadmin',
                         'secret_key': 'rustfsadmin'},
          }
          for name, connection in configurations.items():
              config = yaml.safe_load(Path('tests/config.yaml').read_text())
              config['storage_backend'] = 'minio'  # Both endpoints implement S3.
              config['base_path'] = f'nightly-{name}'
              config['minio'].update(bucket_name='test-bucket', region='us-east-1', **connection)
              path = Path(os.environ['RUNNER_TEMP']) / f'python-e2e-{name}.yaml'
              path.write_text(yaml.safe_dump(config))
          PY

      - name: Require both remote identities in MinIO lane
        if: matrix.backend == 'minio'
        run: |
          echo "E2E_SECONDARY_CONFIG_FILE=$RUNNER_TEMP/python-e2e-rustfs.yaml" >> "$GITHUB_ENV"
          echo "E2E_REQUIRE_SECONDARY=1" >> "$GITHUB_ENV"

      - name: Run remote integration tests
        env:
          TEST_CONFIG_FILE: ${{ runner.temp }}/python-e2e-${{ matrix.backend }}.yaml
        run: ./python/.venv/bin/python -m pytest -c tests/pytest.ini tests/integration/ -v --tb=short --junitxml="$RUNNER_TEMP/python-e2e-${{ matrix.backend }}.xml"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-e2e-${{ matrix.backend }}
          path: ${{ runner.temp }}/python-e2e-${{ matrix.backend }}.xml

  talon-e2e:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python test environment with Talon
        uses: ./.github/actions/setup-python-test
        with:
          python-version: '3.11'
          with-talon: 'True'

      - name: Verify Talon is available to Python tests
        run: grep -Eq '^WITH_TALON:BOOL=ON$' cpp/build/Release/CMakeCache.txt

      - name: Install integration test dependencies
        run: uv pip install --python ./python/.venv/bin/python -r ./tests/requirements.txt

      - name: Resolve Talon revision
        id: talon_revision
        run: |
          revision="$(sed -nE '/^talon = /s/.*rev = "([0-9a-f]{40})".*/\1/p' cpp/src/format/bridge/rust/Cargo.toml)"
          if [[ ! "$revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Failed to resolve the pinned Talon revision" >&2
            exit 1
          fi
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Checkout Talon
        uses: actions/checkout@v4
        with:
          repository: milvus-io/talon
          ref: ${{ steps.talon_revision.outputs.revision }}
          path: talon

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Talon build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: talon -> target

      - name: Install Talon build dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Build Talon services
        working-directory: ./talon
        run: |
          cargo build --release --locked \
            -p talon-coordinator --bin talon-coordinator \
            -p talon-worker --bin talon-worker

      - name: Start MinIO
        run: bash ./cpp/scripts/setup_minio.sh

      - name: Start Talon services
        env:
          TALON_WORKER_BACKEND: s3
          TALON_WORKER_BLOCK_SIZE: '8388608'
          TALON_WORKER_CACHE_DIRS: ${{ runner.temp }}/talon-cache
          TALON_WORKER_CAPACITY_BYTES: '1073741824'
          TALON_WORKER_S3_REGION: us-east-1
          TALON_WORKER_S3_ENDPOINT: http://127.0.0.1:9000
          TALON_WORKER_S3_ACCESS_KEY_ID: minioadmin
          TALON_WORKER_S3_SECRET_ACCESS_KEY: minioadmin
          TALON_WORKER_S3_PATH_STYLE: 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/talon-cache" "$RUNNER_TEMP/talon-logs"
          ./talon/target/release/talon-coordinator \
            --listen 127.0.0.1:7000 \
            --admin-listen 127.0.0.1:8000 \
            >"$RUNNER_TEMP/talon-logs/coordinator.log" 2>&1 &
          echo "TALON_COORDINATOR_PID=$!" >> "$GITHUB_ENV"
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/readyz >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/readyz
          ./talon/target/release/talon-worker \
            --listen 127.0.0.1:7001 \
            --advertise-addr 127.0.0.1:7001 \
            --admin-listen 127.0.0.1:8001 \
            --coordinator 127.0.0.1:7000 \
            --block-size 8388608 \
            >"$RUNNER_TEMP/talon-logs/worker.log" 2>&1 &
          echo "TALON_WORKER_PID=$!" >> "$GITHUB_ENV"
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8001/readyz >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8001/readyz

      - name: Configure Talon Python tests
        run: |
          ./python/.venv/bin/python - <<'PY'
          import os
          from pathlib import Path
          import yaml

          config = yaml.safe_load(Path('tests/config.yaml').read_text())
          config['storage_backend'] = 'minio'
          config['base_path'] = 'nightly-talon'
          config['minio'].update(
              address='http://localhost:9000', bucket_name='test-bucket',
              access_key='minioadmin', secret_key='minioadmin', region='us-east-1',
          )
          (Path(os.environ['RUNNER_TEMP']) / 'python-e2e-talon.yaml').write_text(yaml.safe_dump(config))
          PY

      - name: Run Talon Python E2E
        env:
          TEST_CONFIG_FILE: ${{ runner.temp }}/python-e2e-talon.yaml
          E2E_TALON: '1'
          E2E_TALON_COORDINATOR: 127.0.0.1:7000
        run: ./python/.venv/bin/python -m pytest -c tests/pytest.ini tests/integration/write_read/test_talon.py -m talon_e2e -v --tb=short --junitxml="$RUNNER_TEMP/python-e2e-talon.xml"

      - name: Stop Talon services
        if: always()
        run: |
          for pid in "${TALON_WORKER_PID:-}" "${TALON_COORDINATOR_PID:-}"; do
            if [ -n "$pid" ]; then kill "$pid" 2>/dev/null || true; fi
          done
          docker logs minio >"$RUNNER_TEMP/talon-logs/minio.log" 2>&1 || true

      - name: Upload Talon test results and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-e2e-talon
          path: |
            ${{ runner.temp }}/python-e2e-talon.xml
            ${{ runner.temp }}/talon-logs/
