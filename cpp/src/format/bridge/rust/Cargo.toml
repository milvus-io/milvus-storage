
[package]
name = "rust-bridge"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["staticlib"]

[features]
default = ["external-table-formats"]
external-table-formats = ["dep:object_store", "dep:lance", "dep:lance-core", "dep:lance-encoding", "dep:lance-file", "dep:lance-index", "dep:lance-io", "dep:lance-table", "dep:opendal", "dep:opendal-paimon", "dep:iceberg", "dep:iceberg-storage-opendal", "dep:typetag", "dep:url", "dep:base64", "dep:crc32fast", "dep:roaring", "dep:paimon"]
io-trace = []
talon = ["dep:talon"]

[dependencies]
talon = { package = "talon-rust-client", git = "https://github.com/milvus-io/talon.git", rev = "010ab9bc9945ca21959e6e773ebd802041b5d079", optional = true }

# common dependencies
anyhow = "1.0.99"
futures = "0.3.31"
lru = "0.16"
paste = "1.0.15"
take_mut = "0.2.2"
async-compat = "0.2.5"
async-stream = "0.3"
tokio = { version = "1.23", features = ["full"] }
snafu = "0.9"

# Arrow Ecosystem
# Lance, Vortex and Paimon use Arrow 58; Iceberg 0.9 retains Arrow 57 internally.
arrow = { version = "58.0.0", features = ["ffi"] }
arrow-array = { version = "58.0.0", features = ["ffi"] }
arrow-schema = "58.0.0"

# Vortex Ecosystem
vortex = { git = "https://github.com/zilliztech/vortex", rev = "088063f0fdf2dd9e6a3db7ed4bb8137e18ca5ee3", features = ["tokio"] }
vortex-btrblocks = { git = "https://github.com/zilliztech/vortex", rev = "088063f0fdf2dd9e6a3db7ed4bb8137e18ca5ee3" }

# Lance Ecosystem
# Cloud features remain enabled for native Lance writers. Lance reads use the
# filesystem-backed reader ObjectStore.
lance = { optional = true, version = "=7.0.0", default-features = false, features = ["aws", "azure", "gcp", "oss"] }
lance-core = { version = "=7.0.0", optional = true }
lance-encoding = { version = "=7.0.0", optional = true }
lance-file = { version = "=7.0.0", optional = true }
lance-index = { version = "=7.0.0", optional = true }
lance-io = { optional = true, version = "=7.0.0", default-features = false, features = ["aws", "azure", "gcp", "oss"] }
lance-table = { version = "=7.0.0", optional = true }

# OpenDAL 0.56 interfaces used by the generic filesystem-backed bridge. No cloud
# service is selected here: production reads delegate every operation to the C++ filesystem.
opendal = { version = "0.56", optional = true }
# Paimon uses OpenDAL 0.58; adapt it to the shared filesystem-backed bridge.
opendal-paimon = { optional = true, package = "opendal-core", version = "=0.58.0" }

# Iceberg Ecosystem
# `iceberg-storage-opendal` is used only by the native `CreateTestTable` writer.
# Its upstream backends support AK/SK or default IAM. Production planning instead
# routes Iceberg reads through the filesystem-backed OpenDAL adapter and does not
# construct those cloud providers.
bytes = "1"
iceberg = { version = "0.9", optional = true }
iceberg-storage-opendal = { optional = true, version = "0.9", features = ["opendal-s3", "opendal-gcs", "opendal-azdls", "opendal-oss"] }
# Required for #[typetag::serde] on the filesystem-backed Iceberg adapter.
typetag = { version = "0.2", optional = true }
parquet = { version = "58.0.0", features = ["arrow"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
uuid = { version = "1", features = ["v7"] }

# Shared ObjectStore and path types used by the filesystem-backed Lance reader
# adapter and the Iceberg URI binding.
object_store = { optional = true, version = "0.13", features = ["aws", "gcp"] }

# Async adapter traits are shared by the filesystem adapters and Vortex layout strategy.
async-trait = "0.1"
# URI parsing is shared by the Lance and Iceberg filesystem adapters.
url = { version = "2", optional = true }

# Paimon split encoding, checksum validation, and roaring deletion vectors.
base64 = { version = "0.22", optional = true }
crc32fast = { version = "1", optional = true }
roaring = { version = "0.11", optional = true }

# Apache Paimon planner and test writer. Keep the exact release and Cargo.lock
# together. Paimon uses the Arrow 58 already present for Lance.
paimon = { optional = true, version = "=0.4.0", default-features = false, features = ["storage-fs", "storage-s3", "storage-oss", "storage-azdls", "storage-gcs", "vortex"] }

# SQL predicate parsing
sqlparser = "0.55"

# CXX bridge
cxx = "1.0.184"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
cxx-build = "1.0.184"

[patch.crates-io]
lance = { git = "https://github.com/zilliztech/lance", rev = "29e34493494a2b9ed6dbde2d5e7b33c367927999" }
lance-core = { git = "https://github.com/zilliztech/lance", rev = "29e34493494a2b9ed6dbde2d5e7b33c367927999" }
lance-encoding = { git = "https://github.com/zilliztech/lance", rev = "29e34493494a2b9ed6dbde2d5e7b33c367927999" }
lance-file = { git = "https://github.com/zilliztech/lance", rev = "29e34493494a2b9ed6dbde2d5e7b33c367927999" }
lance-index = { git = "https://github.com/zilliztech/lance", rev = "29e34493494a2b9ed6dbde2d5e7b33c367927999" }
lance-io = { git = "https://github.com/zilliztech/lance", rev = "29e34493494a2b9ed6dbde2d5e7b33c367927999" }
lance-table = { git = "https://github.com/zilliztech/lance", rev = "29e34493494a2b9ed6dbde2d5e7b33c367927999" }

[lints.rust]
deprecated = "deny"
