
[package]
name = "rust-bridge"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["staticlib"]

[features]
io-trace = []
s3-crt-async = []
talon = ["dep:talon", "dep:talon-cache-client", "s3-crt-async"]

[dependencies]
talon = { package = "talon-rust-client", git = "https://github.com/milvus-io/talon.git", rev = "1e2482ac7a85d9a9954ffd81d89f9662f45a7803", optional = true }
talon-cache-client = { git = "https://github.com/milvus-io/talon.git", rev = "1e2482ac7a85d9a9954ffd81d89f9662f45a7803", optional = true }

# common dependencies
anyhow = "1.0.99"
futures = "0.3.31"
lru = "0.16"
paste = "1.0.15"
take_mut = "0.2.2"
async-compat = "0.2.5"
async-stream = "0.3"
tokio = { version = "1.23", features = ["full"] }
snafu = "0.9"

# Arrow Ecosystem
arrow = "56.2.0"
arrow-array = {version = "56.2.0", features = ["ffi"]}
arrow-data = {version = "56.2.0", features = ["ffi"]}
arrow-schema = "56.2.0"

# Lance 7 uses Arrow 58 while Vortex and Iceberg still use Arrow 56. Keep both
# versions explicit and bridge them independently through Arrow's C Data API.
arrow58 = { package = "arrow", version = "58.0.0" }
arrow-array58 = { package = "arrow-array", version = "58.0.0", features = ["ffi"] }
arrow-schema58 = { package = "arrow-schema", version = "58.0.0" }

# Vortex Ecosystem
vortex = { git = "https://github.com/zilliztech/vortex", branch = "v0.75.0-patched", features = ["tokio"] }
vortex-btrblocks = { git = "https://github.com/zilliztech/vortex", branch = "v0.75.0-patched" }

# Lance Ecosystem
# Cloud features remain enabled for native Lance writers. Lance reads use the
# filesystem-backed reader ObjectStore.
lance = { version = "=7.0.0", default-features = false, features = ["aws", "azure", "gcp", "oss"] }
lance-core = "=7.0.0"
lance-encoding = "=7.0.0"
lance-file = "=7.0.0"
lance-index = "=7.0.0"
lance-io = { version = "=7.0.0", default-features = false, features = ["aws", "azure", "gcp", "oss"] }
lance-table = "=7.0.0"

# OpenDAL 0.56 interfaces used by the generic filesystem-backed bridge. No cloud
# service is selected here: production reads delegate every operation to the C++ filesystem.
opendal = "0.56"

# Iceberg Ecosystem
# `iceberg-storage-opendal` is used only by the native `CreateTestTable` writer.
# Its upstream backends support AK/SK or default IAM. Production planning instead
# routes Iceberg reads through the filesystem-backed OpenDAL adapter and does not
# construct those cloud providers.
bytes = "1"
iceberg = "0.9"
iceberg-storage-opendal = { version = "0.9", features = ["opendal-s3", "opendal-gcs", "opendal-azdls", "opendal-oss"] }
# Required for #[typetag::serde] on the filesystem-backed Iceberg adapter.
typetag = "0.2"
parquet = { version = "56.2.0", features = ["arrow"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
uuid = { version = "1", features = ["v7"] }

# Shared ObjectStore and path types used by the filesystem-backed Lance reader
# adapter and the Iceberg URI binding.
object_store = { version = "0.13", features = ["aws", "gcp"] }

# Async adapter traits are shared by the filesystem adapters and Vortex layout strategy.
async-trait = "0.1"
# URI parsing is shared by the Lance and Iceberg filesystem adapters.
url = "2"

# Paimon split encoding, checksum validation, and roaring deletion vectors.
base64 = "0.22"
crc32fast = "1"
roaring = "0.11"

# Apache Paimon planner and test writer. Keep the exact release and Cargo.lock
# together. Paimon uses the Arrow 58 already present for Lance.
paimon = { version = "=0.3.0", default-features = false, features = ["storage-fs", "storage-s3", "storage-oss", "storage-azdls", "storage-gcs", "vortex"] }

# SQL predicate parsing
sqlparser = "0.55"

# CXX bridge
cxx = "1.0.184"

[dev-dependencies]
talon-transport = { git = "https://github.com/milvus-io/talon.git", rev = "1e2482ac7a85d9a9954ffd81d89f9662f45a7803" }
tempfile = "3"
# Match Paimon's OpenDAL type in snapshot error-classification tests.
opendal-paimon = { package = "opendal-core", version = "=0.58.0" }

[build-dependencies]
cxx-build = "1.0.184"

[patch.crates-io]
# Backport lance-format/lance#7638 so cancelled reads release scheduler reservations,
# and zilliztech/lance#2 so zero-capacity caches bypass Moka's single-flight waiters.
# Patch lance-io's workspace dependencies from the same revision to keep one crate identity.
lance-arrow = { git = "https://github.com/zilliztech/lance", rev = "d512a02e636057fc9e3bdd2304548e19bbd1a369" }
lance-core = { git = "https://github.com/zilliztech/lance", rev = "d512a02e636057fc9e3bdd2304548e19bbd1a369" }
lance-io = { git = "https://github.com/zilliztech/lance", rev = "d512a02e636057fc9e3bdd2304548e19bbd1a369" }
lance-namespace = { git = "https://github.com/zilliztech/lance", rev = "d512a02e636057fc9e3bdd2304548e19bbd1a369" }

[lints.rust]
deprecated = "deny"
